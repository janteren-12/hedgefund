name: Refresh 13F filings

# Runs fetch_filings.py on a schedule and commits the updated database
# back to the repo. Render's free web service auto-deploys on every push,
# so this is what keeps the live site's data current without needing any
# paid hosting (a free Render web service has no persistent disk, so the
# database has to travel with the deploy instead).
on:
  schedule:
    # Every Monday at 13:00 UTC. 13F filings are quarterly with a 45-day
    # deadline after quarter-end, so most weeks this just confirms there's
    # nothing new - cheap and safe to run more often than strictly needed.
    - cron: "0 13 * * 1"
  workflow_dispatch: {} # lets you trigger a refresh manually from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python fetch_filings.py

      - name: Commit updated database if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/filings.db
          git diff --cached --quiet && echo "No changes to commit." || git commit -m "Refresh 13F filings data"
          git push
